<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680">
<defs>
 <linearGradient id="top" x1="0" y1="0" x2=".12" y2="1">
  <stop stop-color="#bd8050"/><stop offset=".28" stop-color="#bd7c48"/><stop offset=".62" stop-color="#a9683b"/><stop offset="1" stop-color="#8b522f"/>
 </linearGradient>
 <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#edb77d" stop-opacity=".38"/><stop offset="1" stop-color="#f0c28a" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#a8663b"/><stop offset=".42" stop-color="#75452b"/><stop offset="1" stop-color="#482d20"/>
 </linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#81502f"/><stop offset=".16" stop-color="#74452b"/><stop offset=".58" stop-color="#543321"/><stop offset="1" stop-color="#39271f"/>
 </linearGradient>
 <linearGradient id="leg" x1="0" y1="0" x2="1" y2=".1">
  <stop stop-color="#38251b"/><stop offset=".2" stop-color="#68412a"/><stop offset=".52" stop-color="#8b5735"/><stop offset=".76" stop-color="#603b26"/><stop offset="1" stop-color="#302119"/>
 </linearGradient>
 <linearGradient id="frontGlow" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#f1bf83" stop-opacity="0"/><stop offset=".5" stop-color="#e8b77a" stop-opacity=".28"/><stop offset="1" stop-color="#f1bf83" stop-opacity="0"/>
 </linearGradient>
</defs>

<!-- Broad floor shadow keeps the table grounded. -->
<ellipse cx="360" cy="651" rx="344" ry="23" fill="#090807" opacity=".48"/>
<ellipse cx="360" cy="642" rx="286" ry="14" fill="#120f0d" opacity=".25"/>

