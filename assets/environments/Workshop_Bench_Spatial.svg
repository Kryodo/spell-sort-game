<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700">
<defs>
  <linearGradient id="topWood" x1="0" y1="0" x2="0.16" y2="1">
    <stop stop-color="#cf9059"/>
    <stop offset=".24" stop-color="#bd7947"/>
    <stop offset=".62" stop-color="#a3653c"/>
    <stop offset="1" stop-color="#814b2d"/>
  </linearGradient>
  <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#f5c58b" stop-opacity=".36"/>
    <stop offset=".58" stop-color="#f1bd7e" stop-opacity=".08"/>
    <stop offset="1" stop-color="#f1bd7e" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#9a5d36"/>
    <stop offset=".35" stop-color="#71432a"/>
    <stop offset="1" stop-color="#42291e"/>
  </linearGradient>
  <linearGradient id="apron" x1="0" y1="0" x2=".08" y2="1">
    <stop stop-color="#80502f"/>
    <stop offset=".22" stop-color="#69422a"/>
    <stop offset=".7" stop-color="#4a3022"/>
    <stop offset="1" stop-color="#34231b"/>
  </linearGradient>
  <linearGradient id="leg" x1="0" y1="0" x2="1" y2=".08">
    <stop stop-color="#342219"/>
    <stop offset=".22" stop-color="#68432b"/>
    <stop offset=".48" stop-color="#8a5735"/>
    <stop offset=".72" stop-color="#5d3a26"/>
    <stop offset="1" stop-color="#2e2019"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#493022"/>
    <stop offset=".5" stop-color="#38271e"/>
    <stop offset="1" stop-color="#2d211a"/>
  </linearGradient>
  <linearGradient id="frontRail" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#9a623a"/>
    <stop offset=".45" stop-color="#684129"/>
    <stop offset="1" stop-color="#3d281d"/>
  </linearGradient>
</defs>

<!-- Soft contact shadow beneath the complete bench. -->
<ellipse cx="360" cy="675" rx="348" ry="18" fill="#080706" opacity=".38"/>
<ellipse cx="360" cy="662" rx="282" ry="12" fill="#120d09" opacity=".24"/>

<!-- Supports are kept behind the apron and tabletop. -->
<path d="M35 402 Q80 413 132 402 L126 627 Q122 657 91 671 L49 664 L28 632Z" fill="url(#leg)"/>
<path d="M588 402 Q640 413 685 402 L692 632 L671 664 L629 671 Q598 657 594 627Z" fill="url(#leg)"/>
<path d="M48 616 Q88 629 126 616 L119 658 Q87 679 48 654Z" fill="#4b3020"/>
<path d="M594 616 Q632 629 672 616 L672 654 Q633 679 601 658Z" fill="#452d1f"/>
<path d="M48 436 Q72 444 104 439 L99 615 Q82 627 63 620Z" fill="#d8a16a" opacity=".11"/>
<path d="M616 439 Q648 444 672 436 L657 620 Q638 627 621 615Z" fill="#e0aa70" opacity=".09"/>

<!-- Deep front apron: one coherent body rather than separate flat panels. -->
<path d="M61 412 Q360 463 659 412 L671 590 Q360 632 49 590Z" fill="#2e2018"/>
<path d="M69 414 Q360 464 651 414 L660 578 Q360 619 60 578Z" fill="url(#apron)"/>
<path d="M85 447 Q360 491 635 447 L638 564 Q360 602 82 564Z" fill="#38271e" opacity=".74"/>
<path d="M98 460 Q180 474 260 467 L258 559 Q178 568 97 555Z" fill="url(#panel)" stroke="#9a6842" stroke-opacity=".45" stroke-width="2"/>
<path d="M278 469 Q360 475 442 469 L442 574 Q360 582 278 574Z" fill="#38271e" stroke="#a16d43" stroke-opacity=".36" stroke-width="2"/>
<path d="M460 467 Q540 474 622 460 L623 555 Q542 568 462 559Z" fill="url(#panel)" stroke="#9a6842" stroke-opacity=".45" stroke-width="2"/>
<path d="M112 477 Q180 489 244 481 M476 481 Q540 489 608 477" fill="none" stroke="#c28b58" stroke-opacity=".22" stroke-width="2"/>
<path d="M87 579 Q360 615 633 579 L631 599 Q360 638 89 599Z" fill="#38261c"/>
<path d="M76 596 Q360 635 644 596" fill="none" stroke="#bd8751" stroke-opacity=".42" stroke-width="3"/>

<!-- A broad, uninterrupted tabletop with a much deeper front-to-back plane. -->
<path d="M148 6 Q360 -9 572 6 L720 442 Q720 460 697 468 Q360 515 23 468 Q0 460 0 442Z" fill="#3b261b" opacity=".62"/>
<path d="M148 0 Q360 -12 572 0 L720 436 Q720 454 697 462 Q360 509 23 462 Q0 454 0 436Z" fill="url(#topWood)"/>
<path d="M148 0 Q360 -12 572 0 L720 436 Q720 454 697 462 Q360 509 23 462 Q0 454 0 436Z" fill="url(#topGlow)"/>

<!-- Broad grain follows the plane and stays subordinate to the props. -->
<g fill="none" stroke-linecap="round">
  <path d="M183 43 Q360 30 537 43 L671 410 Q360 455 49 410" stroke="#603b27" stroke-opacity=".23" stroke-width="3"/>
  <path d="M129 120 Q360 108 591 120 L646 315 Q360 355 74 315" stroke="#653e28" stroke-opacity=".18" stroke-width="2.5"/>
  <path d="M91 245 Q360 279 629 245" stroke="#5b3825" stroke-opacity=".20" stroke-width="3"/>
  <path d="M54 362 Q360 405 666 362" stroke="#5b3825" stroke-opacity=".18" stroke-width="3"/>
  <path d="M183 26 Q360 12 537 26" stroke="#f5ca91" stroke-opacity=".38" stroke-width="2.5"/>
  <path d="M105 176 Q177 183 249 176 M270 170 Q360 163 450 170 M471 176 Q543 183 615 176" stroke="#f4c58b" stroke-opacity=".18" stroke-width="2"/>
  <path d="M32 437 Q360 482 688 437" stroke="#f1c087" stroke-opacity=".35" stroke-width="2"/>
</g>

<!-- Rounded near lip creates the visual transition into the thick front edge. -->
<path d="M0 432 Q360 482 720 432 L720 451 Q720 468 697 475 Q360 522 23 475 Q0 468 0 451Z" fill="url(#frontRail)"/>
<path d="M8 438 Q360 488 712 438" fill="none" stroke="#e5b47a" stroke-opacity=".62" stroke-width="3"/>
<path d="M17 459 Q360 507 703 459" fill="none" stroke="#2a1b14" stroke-opacity=".62" stroke-width="3"/>

<!-- Small rounded joinery details, kept low-contrast. -->
<g fill="#bd8952" opacity=".55">
  <ellipse cx="181" cy="535" rx="4" ry="6"/>
  <ellipse cx="539" cy="535" rx="4" ry="6"/>
</g>
<g fill="none" stroke="#d3a06a" stroke-opacity=".18" stroke-width="2">
  <path d="M108 610 Q360 643 612 610"/>
  <path d="M65 633 Q89 647 111 641 M609 641 Q631 647 655 633"/>
</g>
</svg>