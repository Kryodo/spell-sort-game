<svg xmlns="http://www.w3.org/2000/svg" width="240" height="220" viewBox="0 0 240 220">
 <defs>
  <linearGradient id="frontGold" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffe5a9"/>
   <stop offset=".22" stop-color="#d7a15d"/>
   <stop offset=".54" stop-color="#89512c"/>
   <stop offset=".82" stop-color="#efc27c"/>
   <stop offset="1" stop-color="#674021"/>
  </linearGradient>
  <linearGradient id="frontCopper" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#f2c17e" stop-opacity=".92"/>
   <stop offset=".34" stop-color="#ac6b3d" stop-opacity=".78"/>
   <stop offset="1" stop-color="#533020" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#fff0ca" stop-opacity="0"/>
   <stop offset=".5" stop-color="#fff0ca" stop-opacity=".9"/>
   <stop offset="1" stop-color="#fff0ca" stop-opacity="0"/>
  </linearGradient>
 </defs>

 <!-- Foreground half of the rolled brass rim. Drawn over the animated liquid. -->
 <path d="M28 76 C38 96 69 108 120 108 C171 108 202 96 212 76"
       fill="none" stroke="#3d2519" stroke-width="13" stroke-linecap="round"/>
 <path d="M29 76 C40 96 70 105 120 105 C170 105 200 96 211 76"
       fill="none" stroke="url(#frontGold)" stroke-width="10" stroke-linecap="round"/>
 <path d="M36 84 C57 101 84 105 120 105 C156 105 183 101 204 84"
       fill="none" stroke="#ffe6ad" stroke-width="1.6" opacity=".86" stroke-linecap="round"/>
 <path d="M45 91 C72 106 96 110 120 110 C144 110 168 106 195 91"
       fill="none" stroke="#56341f" stroke-width="2" opacity=".78" stroke-linecap="round"/>

 <!-- A raised copper band catches the warm light across the near body. -->
 <path d="M46 163 Q120 194 194 163" fill="none" stroke="#43291d" stroke-width="7" opacity=".72" stroke-linecap="round"/>
 <path d="M47 160 Q120 189 193 160" fill="none" stroke="url(#frontCopper)" stroke-width="4.6" stroke-linecap="round"/>
 <path d="M61 169 Q120 190 179 169" fill="none" stroke="#f4c27e" stroke-width="1.5" opacity=".70" stroke-linecap="round"/>

 <!-- Fine front-facing highlights that give the metal a rounded lip. -->
 <path d="M57 111 C61 145 75 170 97 184" fill="none" stroke="url(#glint)" stroke-width="3.2" opacity=".56" stroke-linecap="round"/>
 <path d="M183 111 C179 145 165 170 143 184" fill="none" stroke="url(#glint)" stroke-width="2.6" opacity=".34" stroke-linecap="round"/>
 <path d="M82 194 Q120 209 158 194" fill="none" stroke="#f1bd76" stroke-width="1.6" opacity=".36" stroke-linecap="round"/>

 <!-- Small warm rivets on the front band. -->
 <circle cx="63" cy="164" r="3.2" fill="url(#frontGold)" stroke="#5b361f" stroke-width="1"/>
 <circle cx="177" cy="164" r="3.2" fill="url(#frontGold)" stroke="#5b361f" stroke-width="1"/>
</svg>