<svg xmlns="http://www.w3.org/2000/svg" width="160" height="365" viewBox="0 0 160 365">
  <defs>
    <linearGradient id="leftCrescent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70c8f2" stop-opacity="0"/>
      <stop offset=".18" stop-color="#8bd8fa" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#c1efff" stop-opacity=".22"/>
      <stop offset=".82" stop-color="#8dd9f7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#5ca9d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightCrescent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ca9d5" stop-opacity="0"/>
      <stop offset=".25" stop-color="#8bd8fa" stop-opacity=".08"/>
      <stop offset=".62" stop-color="#b8edff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#70c8f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftEdgeGlint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#83d8ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#d5f7ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#83d8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- A broad, shallow left caustic follows the width of the rounded foot. -->
  <path d="M28 326
    C37 318 51 314 66 315
    C76 316 84 319 90 323
    C81 321 73 320 64 320
    C50 320 38 325 31 331
    C29 330 28 328 28 326 Z"
    fill="url(#leftCrescent)" opacity=".72"/>
  <path d="M34 325
    C45 319 57 317 69 318
    C58 318 46 322 36 328 Z"
    fill="url(#leftEdgeGlint)" opacity=".32"/>

  <!-- A small dark break keeps the reflection from becoming a continuous base line. -->

  <!-- The right-side return is wider and flatter, but remains much fainter. -->
  <path d="M96 323
    C105 318 116 317 124 322
    C129 325 131 328 132 330
    C127 331 122 329 117 326
    C110 323 103 322 96 323 Z"
    fill="url(#rightCrescent)" opacity=".58"/>
</svg>
